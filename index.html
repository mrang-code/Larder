<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141815" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Larder">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Larder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E8; --card:#FFFDF9; --ink:#1E2621; --muted:#6E756C; --line:#E6DED0;
  --green:#2D5B4C; --green-ink:#FFFFFF; --green-soft:#E1ECE5;
  --red:#C8462A; --red-soft:#F8E1D9; --amber:#B57A0C; --amber-soft:#F7ECD3;
  --chip:#EFE8DC; --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.05);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141815; --card:#1D221E; --ink:#ECEDE8; --muted:#9AA197; --line:#2E352F;
    --green:#7FBFA6; --green-ink:#0F1B16; --green-soft:#22332B; --red:#F08A6E; --red-soft:#3A2420;
    --amber:#E5B455; --amber-soft:#382D17; --chip:#262C27; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 110px calc(16px + env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand h1{font-family:Fraunces,serif;font-weight:650;font-size:28px;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--green)}
.iconbtn{border:1px solid var(--line);background:var(--card);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
h2{font-family:Fraunces,serif;font-weight:650;font-size:21px;margin:18px 0 10px}
h3{margin:0;font-size:16px;font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec small{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--chip)}
.btn.pri{background:var(--green);color:var(--green-ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--green);font-weight:600;padding:0;cursor:pointer}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--green);color:var(--green-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.list{overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.rmain{flex:1;min-width:0}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname .qty{font-weight:400;color:var(--muted);margin-left:4px}
.rsub{font-size:12.5px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--chip);white-space:nowrap}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.soon{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.catlabel{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 4px 6px;font-weight:600}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.soonc{min-width:132px;padding:12px;border-radius:14px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.soonc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soonc span{font-size:12px;font-weight:600}
.soonc.bad{background:var(--red-soft);border-color:transparent}.soonc.bad span{color:var(--red)}
.soonc.soon{background:var(--amber-soft);border-color:transparent}.soonc.soon span{color:var(--amber)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 4px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.empty{text-align:center;padding:34px 20px}
.empty .big{font-size:40px}
.empty p{color:var(--muted);margin:6px 0 16px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spice{padding:12px;cursor:pointer}
.spice b{display:block;font-size:14px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:var(--chip);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.bar.low i{background:var(--red)}
.spice small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.rcard{padding:14px;margin-bottom:10px;cursor:pointer}
.rtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.meta{font-size:13px;color:var(--muted);margin-top:3px}
.uses{margin-top:8px;font-size:13px;background:var(--amber-soft);color:var(--amber);padding:6px 10px;border-radius:10px;font-weight:600}
.miss{margin-top:6px;font-size:13px;color:var(--muted)}
.ring{font-size:12px;font-weight:700;padding:4px 8px;border-radius:9px;background:var(--green-soft);color:var(--green);white-space:nowrap}
.ring.part{background:var(--chip);color:var(--muted)}
.ai{padding:14px;margin:6px 0 4px;background:linear-gradient(135deg,var(--green-soft),var(--card))}
.ai p{margin:4px 0 10px;font-size:13.5px;color:var(--muted)}
.inrow{display:flex;gap:8px}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:12px 0 5px}
.check{display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green)}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.tick.on{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.li.done .rname{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav button.on{color:var(--green)}
nav svg{width:23px;height:23px}
.badge{position:absolute;top:0;left:calc(50% + 6px);background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:1px 6px;font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(10,12,10,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(92vh - env(safe-area-inset-top));overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(105%);transition:transform .25s ease;z-index:11;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .in{max-width:560px;margin:0 auto}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:none}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.shead h2{margin:4px 0}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .btn{flex:1}
.prow{padding:10px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .g{display:grid;grid-template-columns:1fr 70px;gap:6px}
.prow .g2{display:grid;grid-template-columns:110px 1fr 28px;gap:6px;margin-top:6px;align-items:center}
.prow input,.prow select{padding:8px 10px;font-size:14px}
.tagspice{font-size:12px;color:var(--green);font-weight:600}
.ing{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing .s{width:22px;text-align:center;font-weight:700}
.ing .s.y{color:var(--green)}.ing .s.n{color:var(--red)}
.ing .t{flex:1}
.ing small{color:var(--muted)}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:12.5px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
input[type=range]{width:100%;accent-color:var(--green)}
.more{display:block;margin:6px auto 0}
.key{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.hint{padding:14px;margin:6px 0 4px}
.hint p{margin:4px 0 10px;font-size:13.5px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],select,textarea,.prow input,.prow select{font-size:16px}
button,.chip,.row,label.btn{touch-action:manipulation}
label.btn{cursor:pointer;display:block}
nav button{font-size:11px}
.altn{margin-top:8px;font-size:13.5px;background:var(--green-soft);padding:9px 11px;border-radius:10px}
.pday{padding:12px 14px;margin-bottom:10px}
.pday-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pday-h small{color:var(--muted);margin-left:6px}
.pmeal{display:flex;align-items:flex-start;gap:8px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.pmeal .rmain{cursor:pointer}
.pmeal .rsub{white-space:normal}
.pwarn{font-size:12.5px;color:var(--red);margin-top:3px}
.cook{position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto}
.cook[hidden]{display:none}
.cook-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.cook-top{display:flex;align-items:center;gap:10px}
.cook-top .rname{flex:1}
.cook-bar{height:5px;background:var(--chip);border-radius:9px;margin:12px 0 22px;overflow:hidden}
.cook-bar i{display:block;height:100%;background:var(--green);transition:width .2s}
.cook-body{flex:1}
.cstep-n{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:10px}
.cstep{font-family:Fraunces,serif;font-size:25px;line-height:1.35;margin-bottom:22px}
.cook-nav{display:flex;gap:10px;margin-top:22px}
.cook-nav .btn{flex:1;padding:16px;font-size:17px}
.cook-nav .btn:first-child{flex:.6}
.toast.act{pointer-events:auto}
.tbtn{background:none;border:0;color:var(--amber);font-weight:700;margin-left:10px;cursor:pointer;font-size:14px;padding:2px 4px}
.sw{position:relative;border-top:1px solid var(--line)}
.sw:first-child{border-top:0}
.sw .row{border-top:0;background:var(--card);position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.sw-bg{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-weight:700;font-size:14px;color:#fff;background:var(--green)}
.sw-bg span:last-child{visibility:hidden}
.sw[data-dir=l] .sw-bg{background:var(--red)}
.sw[data-dir=l] .sw-bg span:first-child{visibility:hidden}
.sw[data-dir=l] .sw-bg span:last-child{visibility:visible}
.sw:not([data-dir]) .sw-bg{visibility:hidden}
.sw.arm .sw-bg span{transform:scale(1.08)}
.ksearch{margin:12px 0 0}
.stats{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:16px;cursor:pointer}
.bars{display:flex;gap:8px;align-items:flex-end;height:170px;margin:10px 0 4px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.bstack{width:100%;max-width:38px;display:flex;flex-direction:column;border-radius:7px;overflow:hidden;min-height:2px;background:var(--chip)}
.bb{background:var(--red);display:block}.bu{background:var(--green);display:block}
.bcol small{font-size:11px;color:var(--muted)}.bcol .bn{font-size:10px}
.key-u,.key-b{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--green);vertical-align:-1px}.key-b{background:var(--red)}
.shop{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--green);flex:none}
.shop:active{background:var(--green-soft)}
.serves{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.serves b{min-width:18px;text-align:center;font-size:16px}
.serves .btn{width:34px;padding:6px 0}
.ing .s.w{color:var(--amber)}
.cookit{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.cookit:first-child{border-top:0}
.cookit .check{flex:1}
.cookit small{color:var(--muted)}
.leftl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.leftl input{width:78px;padding:7px 9px}
.leftl input:disabled{opacity:.4}
.pmac{font-size:12px;color:var(--green);font-weight:600;margin-top:2px}
.pmeal .slot{width:66px;flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding-top:3px}
.pmeal.empty{align-items:center;padding:10px 0 0;text-align:left}
.pmeal .x{font-size:18px}
.pneed{color:var(--amber) !important;font-weight:600}
.pgood{color:var(--green) !important}
.pmacs{display:grid;grid-template-columns:auto 60px;gap:2px 8px;align-items:center;font-size:11.5px;color:var(--muted);font-weight:600}
.mbar{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--amber);border-radius:5px}
.mbar i.ok{background:var(--green)}.mbar i.over{background:var(--red)}
.plansum{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px}
.ptip{margin:8px 0 0;color:var(--amber)}
.pmeal.done .rname{color:var(--muted)}
.pmeal.past .slot{opacity:.6}
.tick-ate{color:var(--green) !important;font-weight:700}
.onb-body h2{margin:10px 0 4px;font-size:25px}
.onb-big{font-size:46px;margin-top:10px}
.dots{display:flex;gap:6px;flex:1}.dots i{width:22px;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--green)}
.scan-in{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
.scan-video{position:relative;margin:12px 0 4px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;transition:box-shadow .2s}
.scan-video.off{aspect-ratio:auto;height:0}
.scan-video video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:3px solid rgba(255,255,255,.85);border-radius:12px}
.scan-video.hit{box-shadow:0 0 0 4px var(--green)}
.scan-video.hit .scan-frame{border-color:var(--green)}
.star{color:var(--amber)}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 6px}
.daynav b{font-size:16px}.daynav .btn{width:40px;padding:6px 0;font-size:18px}
.drow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.drow:first-child{border-top:0}
.drow .rsub{white-space:normal}
.mchip{border:0;background:var(--green-soft);color:var(--green);font-weight:600;font-size:11.5px;border-radius:999px;padding:2px 8px;cursor:pointer}
.mini{display:flex;align-items:center;gap:6px}.mini .btn{width:30px;padding:5px 0}.mini b{min-width:22px;text-align:center}
.damt{width:84px !important;padding:7px 9px !important;font-size:15px}
.pview summary{cursor:pointer;color:var(--green);font-weight:600;font-size:13.5px;margin-top:10px}
.pview pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 0}
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <header>
      <div class="brand"><h1>Larder</h1><div class="sync" id="sync"><i></i><span>Loading…</span></div></div>
      <div style="display:flex;gap:8px"><button class="iconbtn" data-act="diary" aria-label="Food diary"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M6 3v18M10 8h5M10 12h5"/></svg></button>
      <button class="iconbtn" data-act="settings" aria-label="Preferences">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button></div>
    </header>
    <main id="main"></main>
  </div>
  <nav><div class="in" id="nav"></div></nav>
  <div class="scrim" data-act="close"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div class="in" id="sheetBody"></div></div>
  <div class="cook" id="cook" hidden></div>
  <div class="cook" id="onb" hidden></div>
  <div class="cook" id="scan" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<script>

function matchIng(keys, ctx){
  ctx = ctx && typeof ctx==='object' ? ctx : {};
  const min = ctx.day||0, ex = ctx.exclude;
  const al = keys.split('|').map(a=>a.trim()).filter(Boolean); let best=null, bd=1e9;
  for (const it of state.items){
    if (it.left) continue;
    const d=daysLeft(it); if (d<min) continue; if (ex && ex.has(it.id)) continue;
    if (al.some(a=>nameMatches(it.name, a)) && d<bd){ best=it; bd=d; }
  }
  return best;
}
function evalRecipe(r, ctx){
  ctx = ctx && typeof ctx==='object' ? ctx : {};
  const day = ctx.day||0, scale = ctx.scale||1;
  const rows = r.i.map(x=>{
    const item = matchIng(x[1], ctx), need = labelQty(x[0], scale), haveQ = item ? (ctx.stock && ctx.stock.has(item.id) ? ctx.stock.get(item.id) : parseQty(item.qty)) : null;
    const short = !!(need && haveQ && need.d===haveQ.d && haveQ.n < need.n*0.9);
    return {label:x[0], keys:x[1], opt:!!x[2], item, rack: item ? null : rackFor(x[1]), need, haveQ, short};
  });
  const req = rows.filter(x=>!x.opt), have = req.filter(x=>x.item||x.rack);
  const missing = req.filter(x=>!x.item && !x.rack), short = req.filter(x=>x.short);
  const seen = new Set(); const urgent = [];
  rows.forEach(x=>{ if (x.item && daysLeft(x.item)<=day+state.prefs.warn && !seen.has(x.item.id)){ seen.add(x.item.id); urgent.push(x.item); } });
  const sp = (r.s||[]).map(k=>({keys:k, sp:findSpice(k)}));
  const cov = req.length ? have.length/req.length : 0;
  const score = cov + urgent.length*0.25 + rows.filter(x=>x.opt&&(x.item||x.rack)).length*0.03 + sp.filter(x=>x.sp).length*0.02 - short.length*0.05;
  return {r, rows, missing, short, urgent, sp, cov, have:have.length, req:req.length, score, scale};
}
function tagsOf(r){ const t=new Set(r.tags||[]); if (t.has('vegan')){ t.add('veg'); t.add('df'); } return t; }
function dietOk(r){
  const p=state.prefs, t=tagsOf(r);
  if (p.diet==='vegetarian' && !t.has('veg')) return false;
  if (p.diet==='vegan' && !t.has('vegan')) return false;
  if (p.diet==='pescatarian' && !(t.has('veg')||t.has('pesc'))) return false;
  if (p.gf && !t.has('gf')) return false;
  if (p.df && !t.has('df')) return false;
  if (p.halal && t.has('pork')) return false;
  const dis = (p.dislikes||'').toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
  if (dis.length && r.i.some(x=>dis.some(d=>x[0].toLowerCase().includes(d) || x[1].split('|').includes(d)))) return false;
  return true;
}
function goalOk(r, goals){
  const t=tagsOf(r);
  for (const g of goals){
    if (g==='hp' && !(macOf(r).p>=25)) return false;
    if (g==='quick' && !(r.t<=30)) return false;
    if (g==='lowcarb' && !t.has('lowcarb')) return false;
    if (g==='budget' && !t.has('budget')) return false;
    if (g==='bfast' && !(BRK.has(r.id) || r.meal==='Breakfast')) return false;
    if (SPECIAL.includes(g) && state.prefs.appliances.includes(g) && !(altOf(r)[g] || eqOf(r).includes(g))) return false;
  }
  return true;
}

function sheetPreview(toks, raw){
  const rows = toks.map(t=>{ const c=classify(t.name); return {...t, spice:c.spice, loc:c.spice?'':c.loc, exp:c.spice?'':defaultExp(t.name,c.loc), cat:c.cat}; });

/* ---------- AI: Gemini (own key) or Claude ---------- */
async function gemini(prompt, useUrl, image, onText, schema, onlyModel){
  const g = getGem(); const models = onlyModel ? [onlyModel] : [g.model||'gemini-3.5-flash', 'gemini-3.5-flash', 'gemini-3.1-flash-lite'].filter((v,i,a)=>a.indexOf(v)===i);
  let last = {status:0, message:'No response'};
  for (const m of models){
    const parts = image ? [{inline_data:{mime_type:'image/jpeg', data:image}}, {text:prompt}] : [{text:prompt}];
    const body = {contents:[{role:'user', parts}], generationConfig:{thinkingConfig:{includeThoughts:true}, maxOutputTokens:12000}};
    if (useUrl) body.tools = [{url_context:{}}];
    else { body.generationConfig.responseMimeType = 'application/json'; if (schema) body.generationConfig.responseSchema = schema; }
    let res = await geminiCall(m, body, onText);
    // If this model rejects one of the optional settings, try once more without them.
    if (res.err && res.err.status===400 && !/api key/i.test(res.err.message||'') && (body.generationConfig.thinkingConfig || body.generationConfig.responseSchema)){
      delete body.generationConfig.thinkingConfig; delete body.generationConfig.responseSchema;
      res = await geminiCall(m, body, onText);
    }
    if (res.text) return res.text;
    last = res.err;
    if (![0,-4,404,429,500,503].includes(last.status)) break;
  }
  throw last;
}
// One streamed request. iPhones drop requests that sit silent for 60 seconds, so the answer is read as it arrives.
async function geminiCall(m, body, onText){
  const g = getGem(); const ctl = new AbortController(); let timer = setTimeout(()=>ctl.abort(), 50000);
  const bump = () => { clearTimeout(timer); timer = setTimeout(()=>ctl.abort(), 50000); };
  let r;
  try { r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:streamGenerateContent?alt=sse`, {method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':g.key}, body:JSON.stringify(body), signal:ctl.signal}); }
  catch(e){ clearTimeout(timer); return {err:{status:0, message: ctl.signal.aborted ? 'timeout' : 'network', model:m}}; }
  if (!r.ok){
    clearTimeout(timer);
    const e = await r.json().catch(()=>({})); const er = Array.isArray(e) ? e[0] : e;
    return {err:{status:r.status, message:(er && er.error && er.error.message)||r.statusText, model:m}};
  }
  let text = '', buf = '', blocked = '', thinking = false;
  try {
    const rd = r.body.getReader(), dec = new TextDecoder();
    const take = line => {
      line = line.trim(); if (!line.startsWith('data:')) return;
      let j; try { j = JSON.parse(line.slice(5)); } catch(e){ return; }
      if (j.promptFeedback && j.promptFeedback.blockReason) blocked = j.promptFeedback.blockReason;
      const c = j.candidates && j.candidates[0];
      ((c && c.content && c.content.parts) || []).forEach(p=>{ if (p.thought) thinking = true; else if (p.text) text += p.text; });
    };
    for (;;){
      const {value, done} = await rd.read(); if (done) break; bump();
      buf += dec.decode(value, {stream:true}); const lines = buf.split('\n'); buf = lines.pop(); lines.forEach(take);
      if (onText) onText(text, thinking);
    }
    take(buf);
  } catch(e){ clearTimeout(timer); return {err:{status:0, message: ctl.signal.aborted ? 'timeout' : 'network', model:m}}; }
  clearTimeout(timer);
  return text ? {text} : {err:{status:-4, message: blocked || 'empty', model:m}};
}
async function askAI(prompt, useUrl, image, onText, schema){
  if (hasGemini()) return await gemini(prompt, useUrl, image, onText, schema);
  if (sampleFn && !useUrl && !image){ const res = await sampleFn(prompt, {modelTier:'default'}); return (res && res.text) || ''; }
  throw {status:-1, message:'no-ai'};
}
function aiErrMsg(e){
  if (!e) return 'Something went wrong. Try again.';
  if (e.status===-1) return 'Add your free Gemini key in Preferences first.';
  if (e.status===-2 || e instanceof SyntaxError) return 'The AI sent back a reply the app couldn’t read. Try again.';
  if (e.status===0) return navigator.onLine===false ? 'No internet connection.' : (e.message==='timeout' ? 'The AI took too long to answer. Try again, or switch to Flash-Lite in Preferences.' : 'Couldn’t connect to Gemini. Check your signal and try again.');
  if (e.status===-4) return 'Gemini sent back an empty answer' + (e.message && e.message!=='empty' ? ' ('+e.message+')' : '') + '. Try again.';
  if (e.status===400 && /api key/i.test(e.message||'')) return 'Your Gemini key was rejected. Check it in Preferences.';
  if (e.status===403) return 'This key isn’t allowed to use Gemini. Check it in Preferences.';
  if (e.status===429 || e.code==='rate_limited') return 'Free daily limit reached. It resets at 8am UK time.';
  return 'Gemini error ' + (e.status||e.code||'') + (e.message ? ': ' + String(e.message).slice(0,140) : '') + '. Try again.';
}
// Reads the AI's JSON, and rescues what it can if the reply is cut off or has small mistakes.
function parseJSON(txt){
  txt = String(txt||'').replace(/```(?:json)?/gi, ''); const a = txt.indexOf('{'); if (a<0) throw {status:-2};
  let s = txt.slice(a);
  const tryP = x => { try { return JSON.parse(x); } catch(e){ try { return JSON.parse(x.replace(/,\s*([}\]])/g, '$1')); } catch(e2){ return undefined; } } };
  let v = tryP(s.slice(0, s.lastIndexOf('}')+1)); if (v !== undefined) return v;
  // Cut back to the last complete object and close whatever was still open.
  let cuts = 0;
  for (let end = s.lastIndexOf('}'); end > 0 && cuts < 80; end = s.lastIndexOf('}', end-1), cuts++){
    const pre = s.slice(0, end+1); const stack = []; let inStr = false, esc = false;
    for (const ch of pre){
      if (inStr){ if (esc) esc = false; else if (ch==='\\') esc = true; else if (ch==='"') inStr = false; continue; }
      if (ch==='"') inStr = true; else if (ch==='{'||ch==='[') stack.push(ch); else if (ch==='}'||ch===']') stack.pop();
    }
    if (inStr) continue;
    v = tryP(pre + stack.reverse().map(c=>c==='{'?'}':']').join('')); if (v !== undefined) return v;
  }
  throw {status:-2};
}
// Ask for JSON; if the reply can't be read, ask once more (using the lighter model if that's not the one in use).
async function askJSON(prompt, o){
  o = o || {};
  try { return parseJSON(await askAI(prompt, o.url, o.image, o.onText, o.schema)); }
  catch(e){
    if (!(e && (e.status===-2 || e instanceof SyntaxError))) throw e;
    const g = getGem(); const alt = hasGemini() ? ((g.model||'gemini-3.5-flash')==='gemini-3.1-flash-lite' ? 'gemini-3.5-flash' : 'gemini-3.1-flash-lite') : null;
    try { return parseJSON(hasGemini() ? await gemini(prompt, o.url, o.image, o.onText, o.schema, alt) : await askAI(prompt, o.url, o.image, o.onText, o.schema)); }

function fileToJpeg(file, max){
  max = max || 1600;
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { try {
      const s = Math.min(1, max/Math.max(img.width, img.height)); const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width*s)); c.height = Math.max(1, Math.round(img.height*s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    } catch(e){ rej(e); } };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}

// Combine two copies of a kitchen. Every record carries _u (when it last changed) and deletions are
// remembered in `del` for 60 days, so edits from different phones merge instead of overwriting.
function mergeStates(a, b){
  a = a || {}; b = b || {};
  const now = Date.now(), del = {};
  [a.del || {}, b.del || {}].forEach(d => { for (const k in d) if (!(del[k] >= d[k])) del[k] = d[k]; });
  for (const k in del) if (now - del[k] > 60 * 864e5) delete del[k];
  const out = {};
  const COL = {items:'i', spices:'s', list:'l', saved:'r', log:'g'};
  for (const c in COL){
    const p = COL[c], m = new Map(), order = [];
    const add = r => { if (!r || r.id == null) return; const ex = m.get(r.id);
      if (!ex){ m.set(r.id, r); order.push(r.id); } else if ((r._u || 0) > (ex._u || 0)) m.set(r.id, r); };
    (Array.isArray(a[c]) ? a[c] : []).forEach(add); (Array.isArray(b[c]) ? b[c] : []).forEach(add);
    out[c] = order.map(id => m.get(id)).filter(r => !(del[p + ':' + r.id] >= (r._u || 0)));
  }
  const pa = a.plan || {}, pb = b.plan || {}, ua = a.planU || {}, ub = b.planU || {};
  out.plan = {}; out.planU = {};
  new Set([...Object.keys(pa), ...Object.keys(pb), ...Object.keys(ua), ...Object.keys(ub)]).forEach(d => {
    const fromA = (ua[d] || 0) >= (ub[d] || 0), v = fromA ? (pa[d] || pb[d]) : (pb[d] || pa[d]), u = Math.max(ua[d] || 0, ub[d] || 0);
    if (u) out.planU[d] = u;
    if (Array.isArray(v) && v.length && !(del['p:' + d] >= u)) out.plan[d] = v;
  });
  out.prefs = (a.prefsU || 0) >= (b.prefsU || 0) ? (a.prefs || b.prefs) : (b.prefs || a.prefs);
  out.prefsU = Math.max(a.prefsU || 0, b.prefsU || 0);
  out.del = del;
  return out;
}

const FRAC = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
const unfrac = s => String(s).replace(/(\d+)?\s*([½¼¾⅓⅔])/, (m,a,b)=>fmtNum((+a||0) + FRAC[b]));
// 1.5 → 1½, 0.25 → ¼ (only for counts like "1½ onions")
function niceNum(n){ const w = Math.floor(n + 1e-9), f = Math.round((n - w)*4)/4; const c = {0.25:'¼', 0.5:'½', 0.75:'¾'}[f]; if (f >= 1) return String(w+1); return c ? (w ? w + c : c) : String(w || fmtNum(n)); }
function parseQty(s){
  s = unfrac(String(s||'').toLowerCase().trim()); if (!s) return null;
  if (/^\S+\s*(tbsp|tsp|tablespoons?|teaspoons?|pinch(es)?|handfuls?|cloves?|dash(es)?|cups?|sprigs?|knobs?|splash)\b/.test(s)) return null;
  const m = s.match(/^(?:x\s*)?(\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(kg|kilos?|g|grams?|gr|ml|litres?|liters?|l|x|tins?|cans?|packs?|bags?|jars?|bottles?|loaf|loaves|bunch(?:es)?|pieces?|fillets?|breasts?|thighs?|pots?|tubs?)?(?![a-z])/);
  if (!m) return null;
  const n = FRAC[m[1]] != null ? FRAC[m[1]] : parseFloat(m[1].replace(',', '.')); const u = m[2] || '';
  if (!(n > 0)) return null;
  if (/^(kg|kilo)/.test(u)) return {n:n*1000, d:'g'};
  if (/^(g|gr|gram)/.test(u)) return {n, d:'g'};
  if (u === 'ml') return {n, d:'ml'};
  if (u === 'l' || /^lit/.test(u)) return {n:n*1000, d:'ml'};
  const w = !u || u === 'x' ? '' : u.replace(/loaves/, 'loaf').replace(/bunches/, 'bunch').replace(/ches$/, 'ch').replace(/s$/, '');
  return {n, d:'n', w};
}
const fmtNum = n => String(+n.toFixed(2));
function fmtQty(q){

  if (q.d === 'g') return q.n >= 1000 ? fmtNum(Math.round(q.n/50)*50/1000) + 'kg' : rnd(q.n) + 'g';
  if (q.d === 'ml') return q.n >= 1000 ? fmtNum(Math.round(q.n/50)*50/1000) + 'L' : rnd(q.n) + 'ml';
  const n = q.n >= 10 ? Math.round(q.n) : Math.round(q.n*2)/2;

}
function labelQty(label, scale){

}
function scaleLabel(label, f){

  let n = parseFloat(m[1].replace(',', '.')) * f, rest = label.slice(m[0].length);
  if (m[3]){ const u = m[3].toLowerCase(), base = u==='kg' ? n*1000 : u==='l' ? n*1000 : n; return fmtQty({n:base, d:/^(g|kg)$/.test(u) ? 'g' : 'ml'}) + rest; }

/* ---------- swipe a kitchen row ---------- */
let swp = null, swipedAt = 0;
document.addEventListener('pointerdown', ev=>{
  const row = ev.target.closest('.sw > .row'); if (!row || (ev.button||0) > 0) return;
  swp = {row, wrap:row.parentElement, x:ev.clientX, y:ev.clientY, dx:0, on:false, id:row.parentElement.dataset.id, pid:ev.pointerId};
});
document.addEventListener('pointermove', ev=>{
  if (!swp || ev.pointerId !== swp.pid) return;
  const dx = ev.clientX - swp.x, dy = ev.clientY - swp.y;
  if (!swp.on){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ swp = null; return; }
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)*1.2){ swp.on = true; swp.row.style.transition = 'none'; try { swp.row.setPointerCapture(ev.pointerId); } catch(e){} }
    else return;
  }
  swp.dx = dx; swp.row.style.transform = `translateX(${dx}px)`;
  swp.wrap.dataset.dir = dx > 0 ? 'r' : 'l';
  swp.wrap.classList.toggle('arm', Math.abs(dx) > swp.row.offsetWidth*0.33);
});
function swEnd(ev){
  if (!swp || ev.pointerId !== swp.pid) return;
  const s = swp; swp = null; if (!s.on) return;
  swipedAt = Date.now(); const w = s.row.offsetWidth; s.row.style.transition = 'transform .18s ease';
  if (Math.abs(s.dx) > w*0.33){
    s.row.style.transform = `translateX(${s.dx > 0 ? w : -w}px)`;
    try { localStorage.setItem('larder-swiped', '1'); } catch(e){}
    setTimeout(()=>itemGone(s.id, s.dx > 0 ? 'used' : 'bin', true), 170);

const ZX_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let scan = null;
function loadZX(){

  return new Promise((res, rej)=>{ const s = document.createElement('script'); s.src = ZX_URL; s.onload = ()=>window.ZXing ? res(window.ZXing) : rej(new Error('zx')); s.onerror = ()=>rej(new Error('zx')); document.head.appendChild(s); });

function zxHints(ZX){ const h = new Map(); h.set(ZX.DecodeHintType.POSSIBLE_FORMATS, [ZX.BarcodeFormat.EAN_13, ZX.BarcodeFormat.EAN_8, ZX.BarcodeFormat.UPC_A, ZX.BarcodeFormat.UPC_E, ZX.BarcodeFormat.CODE_128]); return h; }
async function nativeDetector(){
  try { if (!('BarcodeDetector' in window)) return null; const f = await BarcodeDetector.getSupportedFormats(); if (!f.includes('ean_13')) return null;
    return new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128'].filter(x=>f.includes(x))}); } catch(e){ return null; }
}
function openScan(){

const scanMsg = m => { const e = $('#scanMsg'); if (e) e.textContent = m; };
async function startCam(){
  const v = $('#scanV');

    const det = await nativeDetector();
    if (det){
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
      if (!scan){ stream.getTracks().forEach(t=>t.stop()); return; }
      v.srcObject = stream; await v.play(); scan.stop = ()=>stream.getTracks().forEach(t=>t.stop());
      const loop = async ()=>{ if (!scan) return; try { const r = await det.detect(v); if (r[0]) onCode(r[0].rawValue); } catch(e){} if (scan) scan.t = setTimeout(loop, 250); };
      loop();
    } else {
      const ZX = await loadZX(); if (!scan) return;
      const reader = new ZX.BrowserMultiFormatReader(zxHints(ZX), 250);
      scan.stop = ()=>{ try { reader.reset(); } catch(e){} };
      await reader.decodeFromConstraints({video:{facingMode:'environment'}, audio:false}, v, res=>{ if (res) onCode(res.getText()); });
      if (!scan){ try { reader.reset(); } catch(e){} return; }
    }
    scanMsg('Point the camera at a barcode. Scan as many as you like.');
  } catch(e){
    const box = $('#scanBox'); if (box) box.classList.add('off');
    scanMsg(e && e.name==='NotAllowedError' ? 'Camera access is off. Allow it when asked (or in iPhone Settings → Safari → Camera), or take a photo of the barcode instead.' : e && e.message==='zx' ? 'Couldn’t load the scanner. Check your signal and try again.' : 'Couldn’t start the camera here. Take a photo of the barcode instead.');
  }
}
async function scanPhoto(file){

  try {
    const det = await nativeDetector();
    if (det){ const bmp = await createImageBitmap(file); const r = await det.detect(bmp); if (r[0]) code = r[0].rawValue; }
    if (!code){ const ZX = await loadZX(); const reader = new ZX.BrowserMultiFormatReader(zxHints(ZX)); const res = await reader.decodeFromImageUrl(url); code = res && res.getText(); }
  } catch(e){}
  URL.revokeObjectURL(url);
  if (code){ scanMsg('Got it. Add another, or tap Next.'); onCode(code); } else scanMsg('Couldn’t find a barcode in that photo. Get closer, keep it sharp, and fill the frame.');
}
async function onCode(code){
  if (!scan) return; code = String(code||'').trim(); if (code.length < 6) return;
  const now = Date.now(), last = scan.seen[code]; scan.seen[code] = now; if (last && now - last < 2500) return; // still the same pack in view
  if (scan.items.some(x=>x.code===code)){ const r = scan.items.find(x=>x.code===code); r.count = (r.count||1)+1; drawScan(); return; }
  const row = {code, name:'', qty:'', loading:true, count:1}; scan.items.unshift(row); drawScan();
  const box = $('#scanBox'); if (box){ box.classList.add('hit'); setTimeout(()=>box.classList.remove('hit'), 350); }
  try { if (navigator.vibrate) navigator.vibrate(40); } catch(e){}
  const p = await lookupProduct(code);
  row.loading = false; if (p){ row.name = p.name; row.qty = p.qty; row.nut = p.nut; row.lab = p.lab; row.pg = p.pg; } else row.unknown = true;
  drawScan();
}
function drawScan(){
  if (!scan) return; const l = $('#scanList'), done = $('#scanDone'); if (!l) return;
  l.innerHTML = scan.items.length ? `<div class="card list">${scan.items.map((r,i)=>`<div class="li"><div class="rmain"><div class="rname">${r.loading ? 'Looking up…' : r.unknown ? 'Not in the database' : esc(r.name)}${r.nut && r.nut.p != null ? `<span class="qty">${r.nut.p}g protein/100g</span>` : ''}${r.qty?`<span class="qty">${esc(r.qty)}</span>`:''}${r.count>1?`<span class="qty">×${r.count}</span>`:''}</div><div class="rsub">${r.unknown ? 'You can name it on the next screen' : esc(r.code)}</div></div><button class="x" data-scan="rm" data-i="${i}" aria-label="Remove">×</button></div>`).join('')}</div>` : '';

}
async function lookupProduct(code){
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,product_name_en,generic_name_en,generic_name,brands,quantity,nutriments,serving_quantity`);
    if (!r.ok) return null; const j = await r.json(); if (j.status !== 1 || !j.product) return null;
    const P = j.product, name = friendlyName(P); if (!name) return null; const n = P.nutriments || {};
    const nut = cleanNut({k:n['energy-kcal_100g'] != null ? n['energy-kcal_100g'] : (n.energy_100g != null ? n.energy_100g/4.184 : null), p:n.proteins_100g, c:n.carbohydrates_100g, f:n.fat_100g});
    const brand = String(P.brands||'').split(',')[0].trim(), pn = String(P.product_name_en || P.product_name || '').trim();
    const lab = (pn && brand && !pn.toLowerCase().includes(brand.toLowerCase()) ? brand + ' ' + pn : pn || brand).replace(/\b(\w+)\s+\1\b/ig, '$1').slice(0, 60);
    return {name, qty:normQty(P.quantity), ...(nut ? {nut} : {}), ...(lab && lab.toLowerCase()!==name.toLowerCase() ? {lab} : {}), ...(+P.serving_quantity > 0 ? {pg:+P.serving_quantity} : {})};
  } catch(e){ return null; }
}
function friendlyName(p){
  let n = p.product_name_en || p.product_name || p.generic_name_en || p.generic_name || '';
  String(p.brands||'').split(',').map(b=>b.trim()).filter(b=>b.length>1).forEach(b=>{ n = n.replace(new RegExp('(^|\\s)' + reEsc(b) + '(?=\\s|$)', 'ig'), ' '); });
  n = n.replace(/\b\d+(?:[.,]\d+)?\s*(?:x\s*\d+\s*)?(g|kg|ml|l|cl|pack|pk)\b/ig, ' ').replace(/\s+/g, ' ').replace(/^[\s\-–,]+|[\s\-–,]+$/g, '').trim();
  if (!n) return '';
  const keys = foodKeysIn(n).sort((a,b)=>b.length-a.length);
  if (keys.length && n.split(' ').length > 3) return cap(keys[0]);
  return cap(n.toLowerCase()).slice(0, 48);
}
function normQty(q){ q = String(q||'').trim(); const p = parseQty(q.replace(/\s+/g, ' ')); return p && !/x/i.test(q) ? fmtQty(p) : q.replace(/\s+/g, '').slice(0, 16); }
function closeScan(){
  if (!scan) return; const s = scan; scan = null; clearTimeout(s.t); try { s.stop && s.stop(); } catch(e){}

let snapMap = null, hhDirty = false, hhBusy = false, hhAgain = false, hhT = null, hhPending = null, hhLast = 0, hhErr = '';
function getHH(){ try { return JSON.parse(localStorage.getItem(HH_LS)||'null'); } catch(e){ return null; } }
function setHH(h){ try { if (h) localStorage.setItem(HH_LS, JSON.stringify(h)); else localStorage.removeItem(HH_LS); } catch(e){} }
const recJ = r => JSON.stringify(r, (k,v)=>k==='_u' ? undefined : v);
const COLS = {items:'i', spices:'s', list:'l', saved:'r', log:'g'}, COLK = {i:'items', s:'spices', l:'list', r:'saved', g:'log'};
function recMap(s){
  const m = new Map();

  for (const d in (s.plan||{})) m.set('p:' + d, JSON.stringify(s.plan[d]));
  m.set('prefs', JSON.stringify(s.prefs)); return m;
}
// Note what changed since the last save, so other phones can tell which copy is newer.
function stamp(){
  const now = Date.now(), cur = recMap(state); if (!snapMap){ snapMap = cur; return false; }
  let ch = false; state.del = state.del || {}; state.planU = state.planU || {};
  cur.forEach((j, k)=>{
    if (snapMap.get(k) === j) return; ch = true;
    const i = k.indexOf(':'), p = k.slice(0, i), id = k.slice(i+1);
    if (k === 'prefs') state.prefsU = now;
    else if (p === 'p') state.planU[id] = now;
    else { const r = (state[COLK[p]]||[]).find(x=>String(x.id)===id); if (r) r._u = now; }
    delete state.del[k];
  });
  snapMap.forEach((j, k)=>{ if (!cur.has(k)){ ch = true; state.del[k] = now; } });
  snapMap = cur; return ch;
}
const shareable = s => ({items:s.items, spices:s.spices, list:s.list, saved:s.saved, log:s.log, plan:s.plan, planU:s.planU||{}, prefs:s.prefs, prefsU:s.prefsU||0, del:s.del||{}});
function dedupeList(){
  const seen = new Set();

function applyRemote(remote){
  if (!remote || typeof remote !== 'object') return;

async function hhCall(path, body, url){
  let r; try { r = await fetch((url || getServer()) + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); } catch(e){ throw {msg:'server'}; }
  const j = await r.json().catch(()=>({}));

});
document.addEventListener('submit', ev=>{
  if (ev.target.id!=='listForm') return; ev.preventDefault();
  const i=$('#listIn'); const v=i.value.trim(); if(!v) return;
  v.split(/[,\n]+/).forEach(s=>addToList(s.trim(),'')); save(); render(); setTimeout(()=>{ const n=$('#listIn'); if(n) n.focus(); },0);
});
document.addEventListener('keydown', ev=>{ if (ev.key==='Enter' && ev.target.id==='aiAsk'){ ev.preventDefault(); runAI(); } if (ev.key==='Escape'){ if (scan){ closeScan(); afterOverlay(); } else if (cook) closeCook(); else closeSheet(); } });
document.addEventListener('input', ev=>{ if (ev.target.id==='kSearch'){ ui.q = ev.target.value; const l = $('#klist'); if (l) l.innerHTML = kitchenList(); } });

/* ---------- boot ---------- */
if (!state.prefs.onboarded && hasData(state)) state.prefs.onboarded = true;
snapMap = recMap(state);
if (sweep()) save();
render();
initRemote(); initSample();
if ('serviceWorker' in navigator && location.protocol==='https:') { navigator.serviceWorker.register('sw.js').catch(()=>{}); navigator.serviceWorker.addEventListener('message', ev=>{ if (ev.data && ev.data.open==='diary' && !onb) openDiary(); }); }
if (location.hash==='#diary'){ try { history.replaceState(null, '', location.pathname); } catch(e){} if (state.prefs.onboarded) setTimeout(()=>openDiary(), 300); }
mirrorNotify(); setTimeout(syncPush, 1500);
if (!state.prefs.onboarded) openOnb();
if (getHH()) setTimeout(hhSync, 800);
setInterval(()=>{ if (!document.hidden && getHH()) hhSync(); }, 45000);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ if (sweep()) save(); else setBadge(); if (cook) keepAwake(true); else if (!overlayOpen()) render(); if (getHH()) setTimeout(hhSync, 300); } });
</script>
