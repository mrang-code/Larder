<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F100F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Larder">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Larder</title>
<style>
:root{
  --bg:#FAFAF7; --fg:#141414; --mut:#8B8B85; --line:#EAEAE5; --soft:#F1F1EC; --acc:#2E6A4E; --acc-fg:#fff; --acc-soft:#E6EFE9;
  --warn:#B4690E; --bad:#C2412D; --sheet:#FFFFFF; --shadow:0 1px 0 rgba(0,0,0,.03);
  --r:14px; --pad:22px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F100F; --fg:#F1F1EE; --mut:#8E908B; --line:#222421; --soft:#1A1C1A; --acc:#86C9A5; --acc-fg:#0F100F; --acc-soft:#1B2A22;
  --warn:#E3A44B; --bad:#EE7A63; --sheet:#161816;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{min-height:110px;resize:vertical}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
::placeholder{color:var(--mut)}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) var(--pad) calc(env(safe-area-inset-bottom) + 110px)}

/* headings */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 22px}
h1{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.icons{display:flex;gap:4px}
.ib{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--fg)}
.ib:active{background:var(--soft)}
.ib svg{width:22px;height:22px}
.ib.acc{background:var(--acc);color:var(--acc-fg)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 4px}
.sec h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0}
.sec .lnk{font-size:14px}
.lnk{color:var(--acc);font-weight:500}
.mut{color:var(--mut)}
.note{color:var(--mut);font-size:14px;margin:8px 0}
.sm{font-size:14px}

/* rows */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);min-height:54px;width:100%;text-align:left;background:var(--bg)}
.row .m{flex:1;min-width:0}
.row .n{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:14px;color:var(--mut);white-space:nowrap}
.row .r.soon{color:var(--warn);font-weight:600}.row .r.bad{color:var(--bad);font-weight:600}
.row .q{color:var(--mut);font-size:14px;margin-left:6px}
.row.dim .n{color:var(--mut)}
.chev{color:var(--mut);opacity:.6}
.dot{width:8px;height:8px;border-radius:4px;flex:none;background:var(--line)}
.dot.soon{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.ok{background:var(--acc)}

/* swipe */
.sw{position:relative;overflow:hidden}
.sw .bgs{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:14px;font-weight:600;color:#fff}
.sw[data-dir=r] .bgs{background:var(--acc);color:var(--acc-fg)}.sw[data-dir=l] .bgs{background:var(--bad)}
.sw[data-dir=r] .bgs .b,.sw[data-dir=l] .bgs .u{visibility:hidden}
.sw .row{position:relative;touch-action:pan-y}

/* hero */
.hero{display:block;width:100%;text-align:left;border-radius:22px;padding:22px;background:var(--acc);color:var(--acc-fg);margin-bottom:6px}
.hero b{display:block;font-size:22px;letter-spacing:-.01em;line-height:1.2}
.hero span{display:block;margin-top:6px;opacity:.85;font-size:14.5px}
.hero:active{transform:scale(.99)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;font-weight:600;font-size:16px;background:var(--soft);color:var(--fg)}
.btn.pri{background:var(--acc);color:var(--acc-fg)}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;margin-top:18px}.btns .btn{flex:1}
.stack{display:grid;gap:10px;margin-top:18px}
.pill{display:inline-flex;align-items:center;height:36px;padding:0 14px;border-radius:18px;background:var(--soft);font-size:14.5px;font-weight:500;margin:0 6px 8px 0}
.pill.on{background:var(--fg);color:var(--bg)}
.pill.out{color:var(--mut);text-decoration:line-through}
.pills{display:flex;flex-wrap:wrap;margin-top:8px}
.pills.row1{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-20px;padding-right:20px}.pills.row1::-webkit-scrollbar{display:none}.pills.row1 .pill{flex:none}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;margin-top:8px}
.seg button{flex:1;height:38px;border-radius:9px;font-size:14.5px;font-weight:500;color:var(--mut)}
.seg button.on{background:var(--sheet);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.stepper button{width:38px;height:36px;border-radius:9px;font-size:20px}
.stepper b{min-width:34px;text-align:center;font-weight:600}
.tog{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;width:100%;text-align:left}
.tog small{display:block;color:var(--mut);font-size:13.5px}
.tog i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
.tog.on i{background:var(--acc)}.tog.on i::after{left:21px}
label.f{display:block;font-size:13.5px;color:var(--mut);margin:18px 0 6px}
.inrow{display:flex;gap:8px}.inrow .btn{width:auto;padding:0 20px;height:48px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}

/* list ticks */
.tick{width:24px;height:24px;border-radius:12px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.row.done .tick{background:var(--acc);border-color:var(--acc)}
.row.done .tick::after{content:"";width:6px;height:11px;border:solid var(--acc-fg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.done .n{color:var(--mut);text-decoration:line-through}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);position:relative}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--fg)}
nav .bd{position:absolute;top:7px;left:calc(50% + 8px);background:var(--bad);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92vh;overflow:auto;background:var(--sheet);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .in{max-width:560px;margin:0 auto;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 26px)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
#app.open .scrim{opacity:1;pointer-events:auto}#app.open .sheet{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s}
#app:not(.open) .sheet{visibility:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),visibility 0s .25s}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:12px 0 6px}
.shead h2{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0;font-weight:700}
.x{width:34px;height:34px;border-radius:17px;background:var(--soft);display:grid;place-items:center;flex:none;font-size:20px;line-height:1;color:var(--mut)}
.meta{color:var(--mut);font-size:14.5px;margin:4px 0 0}
.why{font-size:15px;margin:10px 0 0}
details{border-bottom:1px solid var(--line)}
details summary{list-style:none;padding:16px 0;font-weight:600;font-size:17px;display:flex;justify-content:space-between;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--mut);font-weight:400;font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details>div{padding-bottom:18px}
ol.steps{padding-left:22px;margin:8px 0 0}ol.steps li{margin:0 0 12px;padding-left:4px}
.ing{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.ing .k{width:18px;flex:none;text-align:center;color:var(--acc);font-weight:700}.ing .k.no{color:var(--bad)}
.ing small{color:var(--mut)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:18px;background:var(--soft);text-align:left;cursor:pointer;min-height:118px}
.tile svg{color:var(--acc);margin-bottom:4px}.tile b{font-size:16px}.tile span{font-size:13px;color:var(--mut);line-height:1.3}
.tile:active{transform:scale(.98)}
.qa{display:flex;gap:8px;margin-top:6px}.qa .btn{width:auto;padding:0 22px;height:50px}
.sugg{display:flex;flex-wrap:wrap;margin-top:8px}
.tr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tr .m{flex:1;min-width:0;display:flex;flex-direction:column}
.tr input.tn,.tr input.tq{background:none;border:0;padding:2px 0;border-radius:0;font-size:16px}
.tr input.tq{font-size:13.5px;color:var(--mut);padding-top:0}
.tr .tp{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.psel{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:15px;background:var(--soft);font-size:13px;font-weight:500;border:0;width:auto;background-image:none}
select.psel{padding-right:10px;-webkit-appearance:none;appearance:none;text-align:center}
.psel.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0}
.edit{display:grid;grid-template-columns:1fr 84px 96px 30px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.edit input,.edit select{padding:10px;font-size:15px;border-radius:10px}
.edit .x{width:30px;height:30px;font-size:16px}

/* overlays */
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.ov .in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) var(--pad) calc(env(safe-area-inset-bottom) + 18px)}
.ovtop{display:flex;align-items:center;gap:12px;height:44px}
.ovtop .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;background:var(--line);border-radius:2px;margin:8px 0 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
.ovbody{flex:1;padding:28px 0}
.stepn{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cues{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cue{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 13px;border-radius:17px;background:var(--soft);font-size:15px;color:var(--mut)}.cue b{color:var(--fg);font-weight:600}
.hb{display:inline-flex;align-items:flex-end;gap:2px;height:16px}.hb i{width:4px;border-radius:2px;background:var(--line)}.hb i:nth-child(1){height:6px}.hb i:nth-child(2){height:9px}.hb i:nth-child(3){height:12px}.hb i:nth-child(4){height:16px}.hb i.on{background:var(--warn)}
.stept{font-size:25px;line-height:1.35;letter-spacing:-.01em;margin-top:14px}
.timer{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.big{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.02em;margin:0}
.card{background:var(--soft);border-radius:18px;padding:22px}
.video{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:10px}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.video .fr{position:absolute;left:12%;right:12%;top:30%;bottom:30%;border:2px solid rgba(255,255,255,.85);border-radius:12px}
.video.hit .fr{border-color:var(--acc)}.video.off{display:none}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 76px);transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:24px;font-size:14.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.act{pointer-events:auto}
.toast button{color:var(--acc);font-weight:700;filter:brightness(1.4)}
@media (prefers-color-scheme:dark){.toast button{filter:none;color:#2E6A4E}}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:48px 6px 10px}
.empty .big{font-size:26px}
.empty p{color:var(--mut);margin:10px 0 24px}
.search{margin:0 0 6px}
.hint{font-size:13px;color:var(--mut);text-align:center;margin-top:14px}
.cost{display:flex;justify-content:space-between;align-items:center;width:100%;margin:14px 0 2px;padding:14px 16px;border-radius:var(--r);background:var(--soft);color:var(--fg);font-size:15px;text-align:left}
.cost b{font-variant-numeric:tabular-nums}.cost small{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div class="wrap"><main id="main"></main></div>
  <nav><div class="in" id="nav"></div></nav>
  <div class="scrim" data-act="close"></div>
  <div class="sheet" id="sheet"><div class="grab"></div><div class="in" id="sheetBody"></div></div>
  <div class="ov" id="cook" hidden></div>
  <div class="ov" id="onb" hidden></div>
  <div class="ov" id="scan" hidden></div>
  <div class="ov" id="check" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* Shelf life. Each category has where it's kept and how long it lasts frozen (days).
   An item is days, or [days, freezerDays, place] where it differs from its category. Days are for unopened food from the day you buy it. */
const SL = {
  Veg:{loc:'fridge',frz:240,items:{spinach:4,'baby spinach':4,lettuce:[5,0],'iceberg lettuce':[7,0],'romaine':[6,0],'little gem':[6,0],rocket:[4,0],'salad leaves':[4,0],'mixed salad':[4,0],'bagged salad':[4,0],salad:[4,0],watercress:[3,0],kale:6,'cavolo nero':5,'spring greens':5,broccoli:6,tenderstem:5,cauliflower:7,cabbage:14,'red cabbage':14,'savoy cabbage':10,'brussels sprout':7,sprout:7,carrot:21,parsnip:21,potato:[30,0,'cupboard'],'new potato':[14,0,'cupboard'],'baby potato':[14,0,'cupboard'],'sweet potato':[21,0,'cupboard'],onion:[30,180,'cupboard'],'red onion':[30,180,'cupboard'],'white onion':[30,180,'cupboard'],shallot:[30,180,'cupboard'],'spring onion':7,leek:10,garlic:[60,180,'cupboard'],ginger:21,tomato:7,'cherry tomato':7,'vine tomato':7,'plum tomato':7,'salad tomato':7,cucumber:[7,0],pepper:7,'bell pepper':7,'red pepper':7,'green pepper':7,'yellow pepper':7,'romano pepper':7,chilli:[10,180],'red chilli':[10,180],'green chilli':[10,180],'scotch bonnet':[10,180],courgette:7,zucchini:7,aubergine:7,eggplant:7,mushroom:5,'chestnut mushroom':5,'button mushroom':5,'portobello':5,'shiitake':5,'oyster mushroom':4,celery:14,celeriac:21,asparagus:4,'green bean':5,'fine bean':5,'runner bean':5,'broad bean':4,'mange tout':5,mangetout:5,'sugar snap':5,'pak choi':4,'bok choy':4,beansprout:[2,0],'bean sprout':[2,0],'corn on the cob':4,'baby corn':5,beetroot:14,radish:10,'butternut squash':[30,240,'cupboard'],squash:[30,240,'cupboard'],pumpkin:[30,240,'cupboard'],swede:21,turnip:14,fennel:7,artichoke:5,okra:4,'fresh peas':4,'stir fry veg':4,'stir-fry veg':4,'stir fry':4,'stir-fry':4,'veg pack':5,vegetable:7,veg:7}},

 {id:'r1',n:'Garlic chicken & spinach rice',t:30,p:40,tags:['gf','df'],i:[['Chicken breast','chicken'],['Rice','rice'],['Spinach','spinach|kale'],['Garlic','garlic'],['Onion','onion',1],['Lemon','lemon',1]],s:['paprika','cumin'],st:['Rinse the rice and cook it in salted water.','Dice the chicken and season with paprika, cumin, salt and pepper.','Fry the chicken in a little oil for 6–8 min until cooked through, adding onion and garlic for the last 2 min.','Stir in the spinach until it wilts, then fold through the rice. Finish with a squeeze of lemon.']},
 {id:'r2',n:'Chicken fajita wraps',t:25,p:36,tags:[],i:[['Chicken','chicken'],['Peppers','pepper'],['Onion','onion'],['Wraps','wrap|tortilla'],['Cheese','cheese|cheddar',1],['Yogurt or sour cream','yogurt|yoghurt|sour cream|skyr',1]],s:['paprika','cumin','chilli powder|chilli flakes|cayenne|fajita'],st:['Slice the chicken, peppers and onion into strips.','Toss the chicken with paprika, cumin, chilli, salt and a little oil.','Fry the chicken in a hot pan for 5 min, add the veg and cook 5 more until charred at the edges.','Warm the wraps and fill with the chicken, cheese and a spoon of yogurt.']},
 {id:'r3',n:'Chicken tikka-style curry',t:40,p:38,tags:['gf'],i:[['Chicken','chicken'],['Onion','onion'],['Garlic','garlic'],['Tinned tomatoes','tinned tomato|chopped tomato|canned tomato|passata'],['Yogurt','yogurt|yoghurt|skyr'],['Ginger','ginger',1],['Rice','rice',1]],s:['garam masala','turmeric','cumin','chilli powder|chilli flakes|cayenne'],st:['Mix the chicken with half the yogurt, half the spices and a pinch of salt. Leave 10 min if you can.','Soften the onion in oil for 6 min, then add garlic, ginger and the rest of the spices for 1 min.','Add the chicken and brown it, then pour in the tomatoes and simmer 15 min.','Take off the heat and stir in the remaining yogurt. Serve with rice.']},
 {id:'r4',n:'Lemon & herb chicken traybake',t:45,p:40,tags:['gf','df'],i:[['Chicken thighs or breast','chicken'],['Potatoes','potato'],['Peppers or courgette','pepper|courgette|red onion'],['Lemon','lemon'],['Garlic','garlic',1]],s:['oregano|mixed herbs|italian|thyme','paprika'],st:['Heat the oven to 200°C (fan 180°C).','Chop the potatoes into chunks and the veg into large pieces.','Toss everything on a tray with oil, lemon juice and zest, herbs, paprika, salt and pepper.','Roast 35–40 min, turning once, until the chicken is cooked and the potatoes are golden.']},
 {id:'r5',n:'Chicken noodle stir-fry',t:20,p:35,tags:['df'],i:[['Chicken','chicken'],['Noodles','noodle'],['Stir-fry veg (peppers, broccoli…)','pepper|broccoli|stir fry|stir-fry|pak choi|beansprout|mange tout|sugar snap'],['Soy sauce','soy sauce'],['Garlic','garlic',1],['Ginger','ginger',1]],s:['five spice|chilli flakes'],st:['Cook the noodles, drain and toss with a drop of oil.','Stir-fry thin strips of chicken in a very hot pan for 4–5 min.','Add garlic, ginger and the veg and cook 2–3 min so the veg stays crisp.','Add the noodles and soy sauce, toss well and serve.']},
 {id:'r6',n:'Spinach & feta omelette',t:10,p:24,tags:['veg','gf','lowcarb'],i:[['Eggs','egg'],['Spinach','spinach'],['Feta or cheese','feta|cheese|cheddar'],['Tomato','tomato',1]],s:['black pepper|chilli flakes'],st:['Beat 3 eggs with salt and pepper.','Wilt the spinach in a non-stick pan with a little oil, then pour in the eggs.','Cook gently, pulling the edges in, until almost set.','Crumble over the feta, fold and serve.']},
 {id:'r7',n:'Shakshuka',t:25,p:18,tags:['veg','gf','budget'],i:[['Eggs','egg'],['Tinned tomatoes','tinned tomato|chopped tomato|canned tomato|passata'],['Onion','onion'],['Pepper','pepper'],['Garlic','garlic',1],['Bread for dipping','bread|pitta|pita|sourdough',1]],s:['cumin','paprika','chilli flakes|chilli powder'],st:['Soften the onion and pepper in oil for 8 min, add garlic and spices for 1 min.','Pour in the tomatoes, season and simmer 8–10 min until thick.','Make little wells and crack in the eggs. Cover and cook 5–6 min until the whites set.','Serve straight from the pan with bread.']},
 {id:'r8',n:'Chilli con carne',t:45,p:34,tags:['gf','df','budget'],i:[['Beef mince','mince'],['Onion','onion'],['Garlic','garlic'],['Kidney beans','kidney bean|black bean|bean'],['Tinned tomatoes','tinned tomato|chopped tomato|canned tomato|passata'],['Pepper','pepper',1],['Rice','rice',1]],s:['chilli powder|chilli flakes|cayenne','cumin','paprika','oregano'],st:['Brown the mince in a large pan, then lift out.','Soften the onion, pepper and garlic, then stir in the spices for a minute.','Return the mince, add tomatoes and drained beans and simmer 25 min, stirring now and then.','Season and serve with rice.']},
 {id:'r9',n:'Spaghetti bolognese',t:40,p:32,tags:['df'],i:[['Mince','mince'],['Pasta','pasta|spaghetti|penne|fusilli|linguine'],['Onion','onion'],['Garlic','garlic'],['Tinned tomatoes','tinned tomato|chopped tomato|canned tomato|passata'],['Carrot','carrot',1],['Parmesan','parmesan|cheese',1]],s:['oregano|mixed herbs|italian|basil'],st:['Soften the onion, carrot and garlic in oil for 8 min.','Add the mince and brown it well.','Add the tomatoes and herbs, season and simmer 20 min.','Cook the pasta, then toss with the sauce and top with parmesan.']},
 {id:'r10',n:'Beef & broccoli',t:25,p:36,tags:['df'],i:[['Steak or beef strips','steak|beef'],['Broccoli','broccoli'],['Soy sauce','soy sauce'],['Garlic','garlic'],['Ginger','ginger',1],['Rice','rice',1]],s:['black pepper|chilli flakes'],st:['Slice the beef thinly against the grain.','Steam or boil the broccoli for 3 min.','Sear the beef in a very hot pan for 2 min, add garlic and ginger.','Add the broccoli, soy sauce and a splash of water, toss until glossy and serve over rice.']},
 {id:'r11',n:'Burger bowl',t:20,p:35,tags:['gf','lowcarb'],i:[['Beef mince','mince'],['Lettuce','lettuce|salad|rocket'],['Tomato','tomato'],['Cucumber','cucumber'],['Cheese','cheese|cheddar',1],['Onion','onion',1]],s:['paprika','garlic powder|onion powder'],st:['Season the mince with salt, paprika and garlic powder and shape into small patties.','Fry 3–4 min each side.','Chop the salad veg and pile into bowls.','Top with the burgers and cheese. A spoon of yogurt with a little ketchup makes a quick sauce.']},
 {id:'r12',n:'Honey soy salmon',t:20,p:34,tags:['pesc','df'],i:[['Salmon fillets','salmon'],['Soy sauce','soy sauce'],['Honey','honey'],['Garlic','garlic'],['Rice','rice',1],['Greens','broccoli|green bean|pak choi|spinach',1]],s:['chilli flakes|sesame'],st:['Mix soy sauce, honey and grated garlic.','Pan-fry the salmon skin side down for 4 min, flip and cook 2 min.','Pour in the sauce and let it bubble and coat the fish.','Serve with rice and steamed greens.']},
 {id:'r13',n:'Salmon & potato traybake',t:35,p:32,tags:['pesc','gf','df'],i:[['Salmon fillets','salmon'],['Potatoes','potato'],['Green veg','green bean|asparagus|broccoli|courgette'],['Lemon','lemon',1]],s:['mixed herbs|dill|thyme|parsley','black pepper'],st:['Heat the oven to 200°C (fan 180°C).','Roast the halved potatoes with oil and salt for 15 min.','Add the green veg and salmon, season with herbs and lemon.','Roast another 12–15 min until the salmon flakes.']},
 {id:'r14',n:'Garlic prawn pasta',t:20,p:30,tags:['pesc'],i:[['Prawns','prawn|shrimp'],['Pasta','pasta|spaghetti|linguine|penne|fusilli'],['Garlic','garlic'],['Cherry tomatoes','tomato',1],['Spinach or rocket','spinach|rocket',1],['Lemon','lemon',1]],s:['chilli flakes|chilli powder'],st:['Cook the pasta, keeping a mug of the water.','Gently fry plenty of garlic and chilli in oil, add tomatoes for 2 min.','Add the prawns and cook until pink.','Toss in the pasta, greens, lemon and a splash of pasta water until glossy.']},
 {id:'r15',n:'Tuna pasta bake',t:35,p:34,tags:['pesc','budget'],i:[['Tinned tuna','tuna'],['Pasta','pasta|penne|fusilli'],['Cheese','cheese|cheddar|mozzarella'],['Tinned tomatoes','tinned tomato|chopped tomato|canned tomato|passata'],['Sweetcorn','sweetcorn|corn',1]],s:['oregano|mixed herbs|italian'],st:['Heat the oven to 200°C (fan 180°C) and boil the pasta for 2 min less than the pack says.','Mix the tomatoes, herbs and seasoning, then stir in the drained tuna and sweetcorn.','Combine with the pasta in a dish and cover with cheese.','Bake 15–20 min until bubbling.']},
 {id:'r16',n:'Chickpea & spinach curry',t:30,p:14,tags:['vegan','gf','df','budget'],i:[['Chickpeas','chickpea'],['Spinach','spinach'],['Onion','onion'],['Garlic','garlic'],['Tinned tomatoes','tinned tomato|chopped tomato|canned tomato|passata'],['Coconut milk','coconut milk|coconut cream',1],['Rice','rice',1]],s:['curry powder|garam masala','turmeric','cumin'],st:['Soften the onion in oil, add garlic and spices for a minute.','Add the tomatoes and drained chickpeas and simmer 10 min.','Stir in coconut milk if using and simmer 5 more.','Fold in the spinach until wilted. Serve with rice.']},
 {id:'r17',n:'Red lentil dal',t:35,p:18,tags:['vegan','gf','df','budget'],i:[['Red lentils','lentil'],['Onion','onion'],['Garlic','garlic'],['Ginger','ginger',1],['Tomatoes','tomato',1],['Rice','rice',1]],s:['turmeric','cumin','garam masala'],st:['Rinse the lentils and simmer in 3x their volume of water with turmeric for 20 min.','Meanwhile fry the onion until golden, then add garlic, ginger, cumin and tomatoes.','Stir this into the lentils with garam masala and salt.','Cook 5 more min and serve with rice.']},

    rq.onsuccess = () => { try { const db = rq.result, tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, 'notify'); tx.oncomplete = () => db.close(); } catch(e){} };
  } catch(e){}
  setBadge();
}
function sweep(){
  let ch = false; const p = state.prefs;
  if (p.autoList) for (const it of state.items) if (!it.left && daysLeft(it)<0 && !it.listed){ addToList(it.name, 'Expired'); it.listed = true; ch = true; }
  for (const s of state.spices){
    if (s.level<=p.lowAt && !s.listed){ addToList(s.name, 'Run out'); s.listed = true; ch = true; }
    else if (s.level>p.lowAt && s.listed){ s.listed = false; ch = true; }
  }
  if (prunePlan()) ch = true;
  return ch;
}

function itemGone(id, how){
  const it = state.items.find(x=>x.id===id); if (!it) return;

  const auto = !it.left && isAlways(it.name) && addToList(it.name, 'Always have');
  lastGone = it.left ? null : it.name;
  save(); closeSheet(); render();
  toastUndo(`${it.name} ${how==='bin' ? 'binned' : 'used up'}${auto ? ' · on your list' : ''}`, !auto && lastGone && !state.list.some(x=>!x.done && normName(x.name)===normName(it.name)) ? '<button data-act="golist">+ List</button>' : '');

/* swipe a kitchen row: right = used, left = binned */
let swp = null;
document.addEventListener('pointerdown', ev=>{
  const row = ev.target.closest('.sw > .row'); if (!row || (ev.button||0) > 0) return;
  swp = {row, wrap:row.parentElement, x:ev.clientX, y:ev.clientY, dx:0, on:false, id:row.parentElement.dataset.id, pid:ev.pointerId};
});
document.addEventListener('pointermove', ev=>{
  if (!swp || ev.pointerId !== swp.pid) return;
  const dx = ev.clientX - swp.x, dy = ev.clientY - swp.y;
  if (!swp.on){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ swp = null; return; }
    if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)*1.2){ swp.on = true; swp.row.style.transition = 'none'; try { swp.row.setPointerCapture(ev.pointerId); } catch(e){} }
    else return;
  }
  swp.dx = dx; swp.row.style.transform = `translateX(${dx}px)`; swp.wrap.dataset.dir = dx > 0 ? 'r' : 'l';
});
function swEnd(ev){
  if (!swp || ev.pointerId !== swp.pid) return;
  const s = swp; swp = null; if (!s.on) return;
  s.wrap.dataset.swiped = Date.now(); const w = s.row.offsetWidth; s.row.style.transition = 'transform .18s ease';
  if (Math.abs(s.dx) > w*0.33){ s.row.style.transform = `translateX(${s.dx > 0 ? w : -w}px)`; try { localStorage.setItem('larder-swiped', '1'); } catch(e){}
    setTimeout(()=>itemGone(s.id, s.dx > 0 ? 'used' : 'bin'), 170); }
  else { s.row.style.transform = ''; setTimeout(()=>{ delete s.wrap.dataset.dir; }, 200); }
}
document.addEventListener('pointerup', swEnd); document.addEventListener('pointercancel', swEnd);

const S_SHOP = {type:'OBJECT', properties:{items:{type:'ARRAY', items:{type:'OBJECT', properties:{name:S_STR, qty:S_STR, place:S_STR, days:{type:'INTEGER'}}, required:['name','place','days']}}, error:S_STR}, required:['items']};

List every food and drink item you can identify. For each:

- "days": whole days from today until its use-by or best-before. Read printed dates when you can see them; otherwise use typical UK shelf life for that food kept there, unopened (fresh chicken or mince 2, fish 2, milk 7, yogurt 10, eggs 21, cheddar 42, spinach 4, bread 5, bananas 5, potatoes 30, tins 700, rice or pasta 365, frozen food 180-240).
Merge identical items into one line with a combined amount. Leave out non-food items, bags, prices and offers. If you can't see any food, return an empty list and put the reason in "error".

    const rows = (j.items||[]).map(x=>{ const name = cap(String(x.name||'').trim()); const loc = ['fridge','freezer','cupboard'].includes(String(x.place).toLowerCase()) ? String(x.place).toLowerCase() : classify(name).loc;

    spend('photo'); if (msg) msg.textContent = `Found ${plural(rows.length,'item')}. Dates are estimates — tap one to change it.`;
    if (done) done(rows); else sheetAdd(rows, 'Check what was picked up. Dates are estimates.');

function slotNow(){ const h = new Date().getHours(); return h < 11 ? 'b' : h < 15 ? 'l' : 'd'; }

const needName = l => stripAmt(l).replace(/^(tbsp|tsp|tablespoons?|teaspoons?|g|kg|ml|l|tins?|cans?|cloves?|handful|pinch|of)\b\s*/gi,'').replace(/^(of)\s+/i,'').toLowerCase();

function fillDinners(n){
  const only = planOnly(), used = new Set(), recent = new Set(state.log.filter(x=>x.t==='cooked' && x.d >= addDays(-3)).map(x=>x.rid));
  weekDays().forEach(d=>{ const e = dinnerOf(d); if (e) used.add(e.id); });
  const cand = pool().filter(r=>slotOk(r, 'd')); let placed = 0;
  for (const d of weekDays()){
    if (placed >= n) break; if (dinnerOf(d)) continue;
    const {stock, excl} = simulatePlan(), k = Math.round((parseD(d)-today())/86400000);
    let best = null, bs = -1e9;
    cand.forEach(r=>{ if (used.has(r.id) || recent.has(r.id)) return;
      const e = evalRecipe(r, {day:k, scale:planPeople()/servesOf(r), stock, exclude:excl});
      if (only && (e.missing.length || e.short.length)) return;
      const s = rankR(e)*3 - e.missing.length*0.9 - e.short.length*0.5 + e.urgent.length*0.4; if (s > bs){ bs = s; best = r; } });
    if (!best) continue;
    planAdd(d, best, 'd', 1); used.add(best.id); placed++;
  }
  return placed;
}
async function planDinners(n, msg){
  let placed = fillDinners(n), added = 0;
  if (planOnly() && placed < n && aiAvailable() && state.items.length){
    if (msg) msg.innerHTML = '<span class="spin"></span>Writing new dinners from what’s left…';
    try { added = await dinnersAI(n - placed); if (added) placed += fillDinners(n - placed); } catch(e){}
  }
  const empty = weekDays().filter(d=>!dinnerOf(d)).length;
  return {placed, added, gaps: placed < n ? Math.min(empty, n - placed) : 0};
}

    : s===1 ? `<p class="big">How do you eat?</p><div class="pills" style="margin-top:18px">${diets.map(([k,l])=>`<button class="pill ${p.diet===k?'on':''}" data-od="${k}">${l}</button>`).join('')}</div>
      <div class="pills">${[['halal','Halal'],['gf','Gluten-free'],['df','Dairy-free']].map(([k,l])=>`<button class="pill ${p[k]?'on':''}" data-of="${k}">${l}</button>`).join('')}</div>
      <button class="tog ${hpOn()?'on':''}" data-ohp="1" style="margin-top:8px"><span>High protein<small>Protein-rich recipes first</small></span><i></i></button>
      <label class="f">Usually cooking for</label><div class="seg">${[1,2,3,4,5,6].map(n=>`<button class="${planPeople()===n?'on':''}" data-opp="${n}">${n}</button>`).join('')}</div>`
    : s===2 ? `<p class="big">What do you cook with?</p><div class="pills" style="margin-top:18px">${APPL.map(([k,l])=>`<button class="pill ${p.appliances.includes(k)?'on':''}" data-oa="${k}">${l}</button>`).join('')}</div>`
    : `<p class="big">Now add your food.</p><p class="meta" style="font-size:17px;margin-top:12px">Take a photo of your shopping, scan barcodes, or type it in.</p>`;
  $('#onb').innerHTML = `<div class="in"><div class="ovtop"><span class="t mut">${s ? `${s} of 3` : ''}</span>${s<3?'<button class="lnk" data-onb="skip">Skip</button>':''}</div>
    <div class="ovbody" style="display:flex;flex-direction:column;justify-content:center">${body}</div>
    ${s<3 ? `<div class="btns">${s>0?'<button class="btn" data-onb="back">Back</button>':''}<button class="btn pri" data-onb="next">${s===0?'Get started':'Next'}</button></div>`
      : `<div class="stack"><button class="btn pri" data-onb="add">Add my food</button><button class="btn" data-onb="sample">Try a sample kitchen first</button></div>`}</div>`;
}
function finishOnb(){ state.prefs.onboarded = true; state.prefs.checked = iso(today()); save(); onb = null; $('#onb').hidden = true; $('#onb').innerHTML = ''; document.body.style.overflow = ''; render(); }
document.addEventListener('click', ev=>{
  if (!onb) return; const p = state.prefs, b = ev.target.closest('[data-onb],[data-od],[data-of],[data-ohp],[data-opp],[data-oa]'); if (!b) return;
  if (b.dataset.od){ p.diet = b.dataset.od; } else if (b.dataset.of){ p[b.dataset.of] = !p[b.dataset.of]; }
  else if (b.dataset.ohp){ const g = p.goals = p.goals||[]; const i = g.indexOf('hp'); if (i>=0) g.splice(i,1); else g.push('hp'); }
  else if (b.dataset.opp){ p.people = +b.dataset.opp; }
  else if (b.dataset.oa){ const i = p.appliances.indexOf(b.dataset.oa); if (i>=0) p.appliances.splice(i,1); else p.appliances.push(b.dataset.oa); }
  else { const a = b.dataset.onb;
    if (a==='next') onb.step++; else if (a==='back') onb.step--;
    else if (a==='skip'){ finishOnb(); return; } else if (a==='add'){ finishOnb(); tab = 'kitchen'; render(); sheetAdd(); return; } else if (a==='sample'){ finishOnb(); loadSample(); return; } }
  renderOnb();
});

/* ---------- events ---------- */
document.addEventListener('click', ev=>{
  const b = ev.target.closest('[data-act]'); if (!b || onb || cook || scan || chk) return;
  if (b.closest('.sw') && Date.now() - (+b.closest('.sw').dataset.swiped||0) < 400) return;
  const a = b.dataset.act;
  if (a==='tab'){ tab = b.dataset.tab; ui.q = ''; render(); window.scrollTo(0,0); return; }
  if (a==='close') return closeSheet();
  if (a==='settings') return sheetSettings();
  if (a==='undo') return doUndo();
  if (a==='golist'){ if (lastGone && addToList(lastGone, 'Used up')){ save(); renderNav(); } $('#toast').classList.remove('show','act'); toast('Added to your list'); return; }
  if (a==='add') return sheetAdd();
  if (a==='sample') return loadSample();
  if (a==='item') return sheetItem(b.dataset.id);
  if (a==='check') return openCheck();
  if (a==='usesoon'){ tab = 'cook'; render(); window.scrollTo(0,0); return; }
  if (a==='staples'){ if (!state.spices.length) return sheetStaple(); ui.editStaples = !ui.editStaples; render(); return; }
  if (a==='addstaple') return sheetStaple();
  if (a==='sptog'){ const s = state.spices.find(x=>x.id===b.dataset.id); if (!s) return; const out = s.level > state.prefs.lowAt; s.level = out ? 0 : 100; sweep(); save(); render(); toast(out ? `${s.name} is on your list` : `Got ${s.name}`); return; }
  if (a==='sprm'){ state.spices = state.spices.filter(x=>x.id!==b.dataset.id); save(); render(); return; }
  if (a==='cooknow') return sheetCookNow();
  if (a==='recipe') return sheetRecipe(b.dataset.id);
  if (a==='browse') return sheetBrowse();
  if (a==='import') return aiAvailable() ? sheetImport() : sheetSettings('ai');
  if (a==='allbook'){ ui.allBook = true; render(); return; }
  if (a==='plan') return sheetPlanSetup();
  if (a==='planpick') return sheetPick(b.dataset.d);
  if (a==='planopen') return sheetRecipeFromPlan(b.dataset.d, b.dataset.id);
  if (a==='planclear'){ snapUndo(); weekDays().forEach(d=>{ const e = dinnerOf(d); if (e) planRemove(d, e.raw); }); save(); render(); toastUndo('Week cleared'); return; }
  if (a==='planlist'){ const onList = new Set(state.list.filter(x=>!x.done).map(x=>normName(x.name))); let n = 0;
    planMissing().forEach(m=>{ if (!onList.has(normName(m.label)) && addToList(m.label, `${m.amt} · for ${m.r.n}`)) n++; }); save(); render(); toast(`Added ${plural(n,'thing')} to your list`); return; }
  if (a==='ltog'){ const x = state.list.find(y=>y.id===b.dataset.id); if (x){ x.done = !x.done; save(); render(); } return; }
  if (a==='lclear'){ snapUndo(); state.list = state.list.filter(x=>!x.done); save(); render(); toastUndo('Basket cleared'); return; }
  if (a==='cost') return sheetCost();
  if (a==='lstore'){ const done = state.list.filter(x=>x.done); state.list = state.list.filter(x=>!x.done); save(); render(); sheetReview(done.map(x=>({name:x.name, qty:''}))); return; }
});
function sheetRecipeFromPlan(d, id){
  sheetRecipe(id);
  const st = $('#sheetBody .stack'); if (!st) return;
  const b = document.createElement('button'); b.className = 'lnk'; b.style.cssText = 'margin-top:6px;color:var(--mut)'; b.textContent = `Take off ${dayLabel(d)}`;
  b.onclick = ()=>{ const e = dinnerOf(d); if (e) planRemove(d, e.raw); save(); closeSheet(); render(); };
  st.appendChild(b);
}
document.addEventListener('submit', ev=>{
  if (ev.target.id !== 'lf') return; ev.preventDefault(); const i = $('#li'), v = i.value.trim(); if (!v) return;
  v.split(/,|\n/).map(s=>s.trim()).filter(Boolean).forEach(n=>addToList(n, '')); save(); render(); setTimeout(()=>{ const j = $('#li'); if (j) j.focus(); }, 30);
});
document.addEventListener('input', ev=>{ if (ev.target.id==='kq'){ ui.q = ev.target.value; const pos = ev.target.selectionStart; render(); const k = $('#kq'); if (k){ k.focus(); try { k.setSelectionRange(pos, pos); } catch(e){} } } });

/* ---------- boot ---------- */
if (!state.prefs.onboarded && hasData(state)) state.prefs.onboarded = true;
if (!state.prefs.v2){   // Larder 2: dinners-only week, no food diary
  Object.keys(state.plan).forEach(d=>{ state.plan[d] = (state.plan[d]||[]).filter(x=>pe(x).m==='d' && !pe(x).left); if (!state.plan[d].length) delete state.plan[d]; });
  state.prefs.v2 = true; if (state.items.length && !state.prefs.checked) state.prefs.checked = addDays(-8);
}
snapMap = recMap(state);
sweep(); save(); render();
initRemote(); initSample(); loadCfg(); loadPrices();
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
mirrorNotify(); setTimeout(syncPush, 1500);
if (!state.prefs.onboarded) openOnb();
if (getHH()) setTimeout(hhSync, 800);
setInterval(()=>{ if (!document.hidden && getHH()) hhSync(); }, 45000);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ setBadge(); loadCfg(); loadPrices(); if (getHH()) hhSync(); if (sweep()){ save(); render(); } } });

</script>
</body>
</html>
