<!doctype html><meta charset="utf-8"><title>diag</title><pre id="o">running…</pre><script>
const S='https://larder-reminders.mustafarangwalla.workers.dev', o=document.getElementById('o'), out=[];
function img(w){ const c=document.createElement('canvas'); c.width=w; c.height=Math.round(w*0.75); const g=c.getContext('2d'); for(let i=0;i<4000;i++){ g.fillStyle=`hsl(${Math.random()*360},60%,${30+Math.random()*50}%)`; g.fillRect(Math.random()*c.width,Math.random()*c.height,20+Math.random()*80,20+Math.random()*80);} g.fillStyle='#fff'; g.font='bold 80px sans-serif'; g.fillText('MILK 2L', 50, 150); return c.toDataURL('image/jpeg',0.85).split(',')[1]; }
const t = async (name, model, w, tc) => { const data = img(w); const body = {model, kind:'other', aid:'dg'+w+Date.now().toString(36).slice(-6), dev:'diagdevice01', body:{contents:[{role:'user', parts:[{text:'List any food words you can read in this picture, as JSON {"items":[...]}'},{inlineData:{mimeType:'image/jpeg', data}}]}], generationConfig:{responseMimeType:'application/json', thinkingConfig:tc}}};
  const t0 = performance.now(); try { const r = await fetch(S+'/ai', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); const txt = await r.text(); out.push(name+' ('+Math.round(data.length/1024)+'KB): '+r.status+' '+txt.replace(/\s+/g,' ').slice(0,300)+' … ('+Math.round(performance.now()-t0)+'ms, '+txt.length+' chars)'); } catch(e){ out.push(name+': FETCH FAILED '+e+' after '+Math.round(performance.now()-t0)+'ms'); } o.textContent = out.join('\n'); };
(async()=>{ await Promise.all([t('lite default','gemini-3.1-flash-lite',1600,{includeThoughts:true}), t('3.5 low','gemini-3.5-flash',1600,{includeThoughts:true, thinkingLevel:'low'}), t('3.5 minimal','gemini-3.5-flash',1600,{thinkingLevel:'minimal'}), t('lite minimal','gemini-3.1-flash-lite',1600,{thinkingLevel:'minimal'})]); o.textContent = out.join('\n') + '\nDONE'; })();
</script>
